name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes_url:
        description: Wishlist release notes pull request or release URL (optional when run from a merged PR)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run PostgreSQL, API, and browser checks
        env:
          WNT_WEB_E2E_OUTPUT: ${{ runner.temp }}/wishlist-browser-e2e.json
          WNT_WEB_E2E_ARTIFACT_DIR: ${{ runner.temp }}/wishlist-browser-artifacts
          WNT_WEB_E2E_TRACE: retain-on-failure
        run: make test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wishlist-browser-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wishlist-browser-e2e.json
            ${{ runner.temp }}/wishlist-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  candidate-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate built API and web images
        env:
          WNT_WEB_E2E_BASE_URL: http://127.0.0.1:18083/wishlist
          WNT_WEB_E2E_OUTPUT: ${{ github.workspace }}/sandboxes/integration/artifacts/browser-e2e.json
          WNT_WEB_E2E_ARTIFACT_DIR: ${{ github.workspace }}/sandboxes/integration/artifacts
          WNT_WEB_E2E_BROWSER: chromium
          WNT_WEB_E2E_TRACE: retain-on-failure
        run: make integration
      - name: Upload candidate integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wishlist-candidate-integration-${{ github.sha }}
          path: sandboxes/integration/artifacts/
          if-no-files-found: warn
          retention-days: 30

  publish-candidate-images:
    needs: [quality, candidate-integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      REGISTRY: 590183855481.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Require infra-platform dispatch token
        env:
          GH_TOKEN: ${{ secrets.INFRA_PLATFORM_PROMOTION_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo 'INFRA_PLATFORM_PROMOTION_TOKEN is required' >&2; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::590183855481:role/github-actions-wishlist-publisher
          role-session-name: wishlist-candidate-publisher
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Authenticate to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and publish API candidate
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file apps/api/Dockerfile \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" \
            --build-arg IMAGE_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$REGISTRY/wishlist-api:$IMAGE_TAG" \
            --metadata-file /tmp/wishlist-api-image.json \
            --push apps/api
      - name: Build and publish web candidate
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file apps/web/Dockerfile \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" \
            --build-arg IMAGE_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$REGISTRY/wishlist-web:$IMAGE_TAG" \
            --metadata-file /tmp/wishlist-web-image.json \
            --push apps/web
      - name: Resolve release notes reference
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.release_notes_url }}
        run: |
          set -euo pipefail
          url="$INPUT_URL"
          if [[ -z "$url" ]]; then
            url="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.state == "closed" and .merged_at != null)] | sort_by(.merged_at) | last | .html_url // empty')"
          fi
          if [[ "$url" =~ ^https://github\.com/wastingnotime/wishlist/pull/[1-9][0-9]*$ ]]; then
            :
          elif [[ "$url" == https://github.com/wastingnotime/wishlist/releases/tag/* ]]; then
            tag="${url#https://github.com/wastingnotime/wishlist/releases/tag/}"
            python3 -c 'import subprocess, sys, urllib.parse; tag = urllib.parse.unquote_to_bytes(sys.argv[1]); sys.exit(1) if any(byte < 0x20 or byte == 0x7f for byte in tag) else sys.exit(subprocess.run([b"git", b"check-ref-format", b"refs/tags/" + tag], check=False).returncode)' "$tag" || {
              echo 'Release tag in release_notes_url is not a valid Git tag' >&2
              exit 1
            }
          else
            echo 'Provide a Wishlist pull request or release URL as release_notes_url' >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Write candidate handoff
        env:
          RELEASE_NOTES_URL: ${{ steps.release-notes.outputs.url }}
        run: |
          api_digest="$(jq -r '.["containerimage.digest"]' /tmp/wishlist-api-image.json)"
          web_digest="$(jq -r '.["containerimage.digest"]' /tmp/wishlist-web-image.json)"
          test -n "$api_digest" && test "$api_digest" != null
          test -n "$web_digest" && test "$web_digest" != null
          cat > wishlist-candidate-handoff.md <<EOF
          # Wishlist candidate handoff

          - Source revision: \`${GITHUB_SHA}\`
          - Source repository: \`${GITHUB_REPOSITORY}\`
          - Candidate workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Release notes: ${RELEASE_NOTES_URL}
          - API image: \`${REGISTRY}/wishlist-api@${api_digest}\`
          - Web image: \`${REGISTRY}/wishlist-web@${web_digest}\`
          - Target architecture: \`linux/arm64\`

          These are candidate images. Production promotion remains owned by infra-platform and requires a reviewed digest-bearing stack change.
          EOF
          jq -n \
            --arg source_revision "$GITHUB_SHA" \
            --arg validation_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg release_notes_url "$RELEASE_NOTES_URL" \
            --arg evidence_artifact "wishlist-candidate-integration-${GITHUB_SHA}" \
            --arg api_reference "${REGISTRY}/wishlist-api@${api_digest}" \
            --arg web_reference "${REGISTRY}/wishlist-web@${web_digest}" \
            '{status: "candidate_published", source_revision: $source_revision, release_notes_url: $release_notes_url, validation: {run_url: $validation_run, evidence_artifact: $evidence_artifact, status: "passed"}, promotion_authority: "infra-platform", images: {api: {reference: $api_reference}, web: {reference: $web_reference}}}' \
            > wishlist-promotion-handoff.json
          cat wishlist-candidate-handoff.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: wishlist-candidate-handoff-${{ github.sha }}
          path: |
            wishlist-candidate-handoff.md
            wishlist-promotion-handoff.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch candidate run to infra-platform
        env:
          GH_TOKEN: ${{ secrets.INFRA_PLATFORM_PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/wastingnotime/infra-platform/actions/workflows/wishlist-image-promotion.yml/dispatches \
            -f ref=main \
            -f "inputs[run_id]=$GITHUB_RUN_ID"
