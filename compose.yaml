name: wishlist
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: local-wishlist-only
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - wishlist_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  wishlist_postgres:
